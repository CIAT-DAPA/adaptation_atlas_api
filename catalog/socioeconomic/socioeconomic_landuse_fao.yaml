# FAO land use by country and year: hectares and share by land use group and sub-group.
id: socioeconomic_landuse_fao
name: Land use by country (FAO)
domain: socioeconomic
description: >-
  Area (hectares and percentage of the national total) of agricultural land, forest land,
  aquaculture and other land, by sub-group, for 2018-2021 from FAOSTAT.
type: tabular
reader: duckdb_parquet
storage:
  path_template: "domain=socioeconomic/type=economic/source=fao_landuse/region=ssa/{file}"
  file_patterns:
    default: "variable=adm0_sectorLanduse.parquet"
  default_file_pattern: default
filters:
  - name: country
    source: column
    target: iso3
    required: false
    case_insensitive: true
    description: ISO 3166-1 alpha-3 country code.
    example: KEN
    allowed_values: [AGO, BDI, BEN, BFA, BWA, CAF, CIV, CMR, COD, COG, COM, CPV, DJI, DZA, EGY, ERI, ESH, ETH, GAB, GHA, GIN, GMB, GNB, GNQ, KEN, LBR, LBY, LSO, MAR, MDG, MLI, MOZ, MRT, MUS, MWI, NAM, NER, NGA, RWA, SDN, SEN, SLE, SOM, SSD, STP, SWZ, SYC, TCD, TGO, TUN, TZA, UGA, ZAF, ZMB, ZWE]
  - name: group
    source: column
    target: group
    description: Land use group.
    allowed_values: [Agriculture, Forest land, Land used for aquaculture, Other land]
  - name: sub_group
    source: column
    target: sub_group
    description: Land use sub-group.
    allowed_values: [Cropland, Permanent meadows and pastures, Naturally regenerating forest, Planted Forest, Land used for aquaculture, Other land]
  - name: year
    source: column
    target: year
    description: Year.
    allowed_values: ["2018", "2019", "2020", "2021"]
order_by: [iso3, year, group, sub_group]
