[project]
name = "adaptation-atlas-api"
version = "0.1.0"
description = "REST API exposing Adaptation Atlas climate, hazard and exposure datasets."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "MIT" }
authors = [{ name = "Alliance Bioversity International - CIAT" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "pyyaml>=6.0,<7.0",
    "duckdb>=1.1,<2.0",
    "pyarrow>=16.0,<20.0",
    "pandas>=2.2,<3.0",
    "boto3>=1.34,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptation_atlas_api"]

# --------------------------------------------------------------------------- #
# Ruff: linting and formatting
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D", "N", "SIM"]
ignore = ["D203", "D213", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# FastAPI declares dependencies and query parameters as call defaults by design.
"src/adaptation_atlas_api/api/v1/**" = ["B008"]

# --------------------------------------------------------------------------- #
# Mypy: static typing
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.10"
packages = ["adaptation_atlas_api"]
mypy_path = "src"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

# --------------------------------------------------------------------------- #
# Import linter: enforce the hexagonal dependency rule
# domain -> ports (interfaces only) ; ports -> domain models ;
# adapters -> ports, domain ; api -> domain, ports ; infrastructure -> (nothing internal)
# --------------------------------------------------------------------------- #
[tool.importlinter]
root_package = "adaptation_atlas_api"

[[tool.importlinter.contracts]]
name = "Domain must not depend on outer layers"
type = "forbidden"
source_modules = ["adaptation_atlas_api.domain"]
forbidden_modules = [
    "adaptation_atlas_api.adapters",
    "adaptation_atlas_api.api",
    "adaptation_atlas_api.infrastructure",
]

[[tool.importlinter.contracts]]
name = "Ports only depend on the domain"
type = "forbidden"
source_modules = ["adaptation_atlas_api.ports"]
forbidden_modules = [
    "adaptation_atlas_api.adapters",
    "adaptation_atlas_api.api",
    "adaptation_atlas_api.infrastructure",
]

[[tool.importlinter.contracts]]
name = "Adapters must not depend on the API layer"
type = "forbidden"
source_modules = ["adaptation_atlas_api.adapters"]
forbidden_modules = ["adaptation_atlas_api.api"]
